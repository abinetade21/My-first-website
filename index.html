<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Fun Facts</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
    }
    h1 {
      color: #333;
      font-size: 24px;
    }
    p {
      color: #666;
      font-size: 18px;
      min-height: 60px;
    }
    button {
      background: #2ea44f;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #2c974b;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Did You Know? 💡</h1>
    <p id="fact">Click the button below to generate a random fun fact!</p>
    <button onclick="newFact()">New Fact</button>
  </div>

  <script>
    const facts = [
      "Honey never spoils. Archaeologists have found 3,000-year-old edible honey!",
      "Bananas are berries, but strawberries aren't!",
      "Octopuses have three hearts and blue blood.",
      "A day on Venus is longer than a year on Venus.",
      "Sharks existed before trees!"
    ];

    function newFact() {
      const randomIndex = Math.floor(Math.random() * facts.length);
      document.getElementById('fact').innerText = facts[randomIndex];
    }
  </script>

</body>
</html>
