html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Website</title>
    <style>
        :root {
            --primary: #2f3542;
            --accent: #ff4757;
            --bg: #f1f2f6;
            --text: #2f3542;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            margin-top: 0;
            color: var(--primary);
        }
        p {
            color: #747d8c;
            margin-bottom: 2rem;
        }
        .btn {
            background-color: var(--accent);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
            display: inline-block;
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello, World! 🚀</h1>
        <p>My simple HTML website is officially up and running live on the internet via GitHub Pages.</p>
        <a href="https://github.com" class="btn" target="_blank">Visit GitHub</a>
    </div>

</body>
</html>
